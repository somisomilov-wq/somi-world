<style>
  /* Layout: full-screen 3D scene; title + mission top, dialogue and key caps bottom */
  :root {
    --sky: #bfe0f2;
    --ink: #24303a;
    --soft: #5b6b78;
    --card: rgba(255, 255, 255, 0.9);
    --accent: #ff7a59;
    --key: #ffffff;
    --key-edge: #b9c3cc;
    --key-on: #ffd95a;
    --go: #2fa36b;
    --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  .dialog .ans { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 24px; margin-top: 6px; }
  .dialog .ans-box { min-width: 96px; text-align: center; padding: 4px 14px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; font-size: 36px; }
  .dialog .ans-hint { font-size: 14px; color: var(--soft); margin: 4px 0; }
  .dialog .ans-hint kbd { font-family: inherit; border: 1.5px solid #b9c2ca; border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; background: #fff; }
  .dialog .ans-pad { display: flex; flex-wrap: wrap; gap: 5px; }
  .dialog .choices .ans-pad button { display: inline-block; padding: 0; box-shadow: none; min-width: 40px; height: 40px; border-radius: 10px; border: 2px solid rgba(36,48,58,.25); background: #fff; font: inherit; font-size: 18px; cursor: pointer; pointer-events: auto; }
  html, body { height: 100%; }
  body { background: var(--sky); color: var(--ink); font-family: var(--font-body); overflow: hidden; touch-action: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; z-index: 2; pointer-events: none; }
  .title {
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    background: var(--card); border-radius: 16px; padding: 8px 14px 10px;
    box-shadow: 0 3px 0 rgba(36, 48, 58, 0.12);
  }
  .title h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; color: var(--accent); }
  .title p { margin: 2px 0 0; font-size: 13px; color: var(--soft); }
  .guide { top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    background: var(--card); border-radius: 999px; padding: 5px 16px 5px 8px; font-family: var(--font-display); font-size: 18px; box-shadow: 0 3px 0 rgba(36,48,58,.12); }
  .guide .arr { width: 28px; height: 28px; transition: transform .12s linear; }
  .mission {
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%);
    max-width: min(520px, calc(100vw - 300px));
    background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 20px;
    font-family: var(--font-display); font-size: 19px; text-align: center; text-wrap: balance;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
  }
  .mission b { color: var(--key-on); font-weight: 400; }
  .floor {
    top: calc(70px + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%);
    background: #111; color: #ff9b3d; border-radius: 12px; padding: 6px 18px;
    font-family: var(--font-display); font-size: 40px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  }
  .prompt {
    bottom: calc(150px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    background: var(--card); border-radius: 14px; padding: 8px 16px;
    font-family: var(--font-display); font-size: 19px; white-space: nowrap;
  }
  .prompt kbd, .dialog kbd {
    font-family: var(--font-display); background: #fff; border: 2px solid var(--key-edge); border-bottom-width: 4px;
    border-radius: 8px; padding: 0 8px; margin: 0 2px;
  }
  .dialog {
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    width: min(680px, calc(100vw - 32px));
    background: #fffdf8; border: 3px solid var(--ink); border-radius: 18px; padding: 14px 18px 14px;
    pointer-events: auto; box-shadow: 0 5px 0 rgba(36, 48, 58, 0.2);
  }
  .dialog .who { font-family: var(--font-display); font-size: 17px; color: var(--accent); margin-bottom: 4px; }
  .dialog .line { font-family: var(--font-display); font-size: 22px; line-height: 1.35; min-height: 30px; }
  .dialog .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .dialog .choices button, .dialog .next, .panel button, .done button {
    font-family: var(--font-display); font-size: 19px; color: var(--ink); text-align: left;
    background: #fff; border: 2px solid var(--key-edge); border-bottom-width: 5px; border-radius: 12px; padding: 8px 14px; cursor: pointer;
  }
  .dialog .choices button span { display: inline-block; min-width: 26px; color: var(--accent); }
  .dialog .next { float: right; margin-top: 8px; font-size: 16px; padding: 6px 12px; }
  .panel {
    right: max(16px, env(safe-area-inset-right, 0px));
    top: 50%; transform: translateY(-50%);
    background: #2c3238; border-radius: 16px; padding: 12px; pointer-events: auto;
    display: grid; grid-template-columns: repeat(3, 52px); gap: 8px;
  }
  .panel p { grid-column: 1 / -1; margin: 0 0 4px; color: #fff; font-family: var(--font-display); font-size: 15px; text-align: center; }
  .panel button { text-align: center; padding: 0; height: 52px; font-size: 20px; border-radius: 50%; background: #e9edf0; }
  .panel button.lit { background: var(--key-on); }
  .keys {
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
  }
  .pad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 54px); gap: 6px; pointer-events: auto; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .side { display: flex; gap: 8px; align-items: flex-end; pointer-events: auto; }
  .keys button {
    font-family: var(--font-display); font-size: 20px; color: var(--ink);
    background: var(--key); border: 2px solid var(--key-edge); border-bottom-width: 6px; border-radius: 12px;
    min-width: 54px; height: 54px; padding: 0 12px; cursor: pointer; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  }
  .keys button small { font-family: var(--font-body); font-size: 11px; margin-top: 3px; }
  .keys button.space { min-width: 120px; }
  .keys button.on { background: var(--key-on); border-bottom-width: 2px; transform: translateY(4px); }
  .done {
    inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto;
    background: rgba(36, 48, 58, 0.35);
  }
  .done .card { background: #fffdf8; border-radius: 22px; padding: 26px 30px; text-align: center; max-width: 420px; margin: 0 16px; border: 3px solid var(--ink); }
  .done h2 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 30px; color: var(--go); }
  .done p { margin: 0 0 16px; font-size: 16px; line-height: 1.5; }
  .done button { text-align: center; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hidden-when-dialog { transition: opacity 0.2s; }
  body.talking .pad, body.talking .side { opacity: 0; pointer-events: none; }
  @media (max-width: 720px) {
    .title p { display: none; }
    .mission { max-width: calc(100vw - 150px); font-size: 16px; left: auto; right: max(16px, env(safe-area-inset-right, 0px)); transform: none; }
    .pad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); }
    .keys button { min-width: 46px; height: 46px; font-size: 17px; }
    .keys button.space { min-width: 90px; }
    .dialog .line { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) { .keys button.on { transform: none; } }
</style>

<div id="stage"></div>

<div class="hud title">
  <h1>소미 월드</h1>
  <p>1장 · 학교 가는 날</p>
</div>
<div id="mission" class="hud mission">소미의 하루가 시작돼요</div>
<div id="guide" class="hud guide" hidden><svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L20 21 L12 16 L4 21 Z" fill="#ff7a59" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="txt"></span></div>
<div id="floor" class="hud floor" hidden>15</div>
<div id="prompt" class="hud prompt" hidden></div>

<div id="panel" class="hud panel" hidden aria-label="엘리베이터 버튼">
  <p>몇 층으로 갈까?</p>
</div>

<div id="dialog" class="hud dialog" hidden>
  <div class="who" id="dlg-who"></div>

    <button type="button" class="left" data-key="ArrowLeft" aria-label="왼쪽으로 돌기">←</button>
    <button type="button" class="down" data-key="ArrowDown" aria-label="뒤로">↓</button>

    <button type="button" class="space" data-key=" ">스페이스<small>점프</small></button>

</div>

<div id="done" class="hud done" hidden>
  <div class="card">
    <h2>학교 도착!</h2>
    <p>15층에서 엘리베이터를 타고 내려와<br>초록불에 횡단보도를 건너 상경초등학교에 왔어요.<br>교실에서 하은이랑 소정이가 기다려요!</p>
    <button type="button" onclick="SomiGames.openHub(2)">2장 교실로 들어가기 ▶</button>
    <button type="button" id="restart">처음부터 다시 하기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js?v=1792840149"></script>
<script src="audio.js?v=1792840149"></script>
<script src="title.js?v=1792840149"></script>
<script src="missions.js?v=1792840149"></script>
<script src="wallet.js?v=1792840149"></script>
<script src="minigames.js?v=1792840149"></script>
<script>
(function () {
  // ===================================================================
  // Renderer, camera, light
  // ===================================================================
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = canvasTex(4, 256, g => {
    const grd = g.createLinearGradient(0, 0, 0, 256);
    grd.addColorStop(0, '#3f97e0'); grd.addColorStop(0.5, '#8cc8f0'); grd.addColorStop(1, '#e4f2f7');
    g.fillStyle = grd; g.fillRect(0, 0, 4, 256);
  });
  scene.fog = new THREE.Fog(0xcfe6f2, 100, 280); scene.fog.color.convertSRGBToLinear();

  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 600);

  const hemi = new THREE.HemisphereLight(0xeaf6ff, 0x8a8f6a, 1.05); hemi.color.convertSRGBToLinear(); hemi.groundColor.convertSRGBToLinear(); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1dc, 1.8); sun.color.convertSRGBToLinear();
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
  sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
  sun.shadow.bias = -0.0006;
  scene.add(sun); scene.add(sun.target);

  // ===================================================================
  // Helpers
  // ===================================================================
  function canvasTex(w, h, draw, rx, ry) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    if (rx || ry) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1); }
    t.anisotropy = 4; t.encoding = THREE.sRGBEncoding;
    return t;
  }
  const std = (color, o) => { const m = new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.7, metalness: 0 }, o || {})); m.color.convertSRGBToLinear(); m.emissive.convertSRGBToLinear(); return m; };
  const matCache = {};
  const M = (color) => matCache[color] || (matCache[color] = std(color));
  function box(w, h, d, material, parent, x, y, z, shadow) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
    m.position.set(x, y, z);
    m.castShadow = shadow !== false; m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  function add(geo, material, parent, x, y, z, shadow) {
    const m = new THREE.Mesh(geo, material);
    m.position.set(x || 0, y || 0, z || 0);
    m.castShadow = shadow !== false; m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  function label(text, w, h, bg, fg, size, opts) {
    return canvasTex(w, h, (g) => {
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      if (opts && opts.border) { g.strokeStyle = opts.border; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10); }
      g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = size + 'px "Jua", "Apple SD Gothic Neo", sans-serif';
      const lines = text.split('\n');
      lines.forEach((t, i) => g.fillText(t, w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.15));
    });
  }
  const signs = [];
  function sign(text, w, h, bg, fg, parent, x, y, z, ry, opts) {
    const px = Math.round(w * 160), py = Math.round(h * 160);
    const m = new THREE.MeshStandardMaterial({ map: label(text, px, py, bg, fg, py * 0.5, opts), roughness: 0.7 });
    const s = box(w, h, 0.08, m, parent, x, y, z, false);
    s.rotation.y = ry || 0;
    signs.push({ m: m, args: [text, px, py, bg, fg, py * 0.5, opts] });
    return s;
  }

  // ===================================================================
  // Textures for Korean apartment facades
  // ===================================================================
  const FLOOR_H = 2.8, FLOORS = 15, BAY = 8;

  const balconyTex = (rx, ry) => canvasTex(512, 180, (g) => {
    g.fillStyle = '#f4f0e8'; g.fillRect(0, 0, 512, 180);
    g.fillStyle = '#e2dccf'; g.fillRect(0, 168, 512, 12);
    [[24, 300], [330, 158]].forEach(([x, w]) => {
      g.fillStyle = '#fbfaf7'; g.fillRect(x, 26, w, 132);
      const grd = g.createLinearGradient(0, 30, 0, 150);
      grd.addColorStop(0, '#9ec4d9'); grd.addColorStop(1, '#6f97ae');
      g.fillStyle = grd; g.fillRect(x + 6, 32, w - 12, 120);
      g.fillStyle = 'rgba(255,255,255,0.35)';
      g.beginPath(); g.moveTo(x + 20, 32); g.lineTo(x + 60, 32); g.lineTo(x + 30, 152); g.lineTo(x + 6, 152); g.fill();
      g.fillStyle = '#fbfaf7';
      for (let i = 1; i < (w > 200 ? 4 : 2); i++) g.fillRect(x + (w / (w > 200 ? 4 : 2)) * i - 3, 32, 6, 120);
      g.fillStyle = 'rgba(255,255,255,0.65)'; g.fillRect(x + 6, 110, w - 12, 4);
      g.fillStyle = 'rgba(80,90,100,0.35)';
      for (let i = x + 14; i < x + w - 8; i += 14) g.fillRect(i, 114, 2, 38);
    });
  }, rx, ry);

  const corridorFarTex = (rx, ry) => canvasTex(512, 180, (g) => {
    g.fillStyle = '#5c646b'; g.fillRect(0, 0, 512, 180);
    for (let x = 30; x < 512; x += 128) {
      g.fillStyle = '#7d8790'; g.fillRect(x, 30, 44, 90);
      g.fillStyle = '#b7c6cf'; g.fillRect(x + 64, 40, 40, 26);
    }
    g.fillStyle = '#f2eee6'; g.fillRect(0, 104, 512, 76);
    g.fillStyle = '#d96c4e'; g.fillRect(0, 112, 512, 6);
    g.fillStyle = '#e1dbcf'; g.fillRect(0, 170, 512, 10);
  }, rx, ry);

  const corridorNearTex = (rx, ry) => canvasTex(1024, 360, (g) => {
    g.fillStyle = '#ece7dd'; g.fillRect(0, 0, 1024, 360);
    g.fillStyle = '#ddd6c8'; g.fillRect(0, 340, 1024, 20);
    for (let x = 0; x < 1024; x += 512) {
      g.fillStyle = '#5d6c79'; g.fillRect(x + 110, 90, 150, 250);
      g.fillStyle = '#6f7f8c'; g.fillRect(x + 120, 100, 130, 230);
      g.fillStyle = '#d7c27a'; g.fillRect(x + 228, 210, 12, 34);
      g.fillStyle = '#c9d3d8'; g.fillRect(x + 150, 130, 70, 14);
      g.fillStyle = '#cbd8de'; g.fillRect(x + 330, 110, 120, 70);
      g.fillStyle = '#f7f5f0'; g.fillRect(x + 330, 142, 120, 6); g.fillRect(x + 387, 110, 6, 70);
      g.fillStyle = '#c5bfb2'; g.fillRect(x + 300, 240, 70, 60);
      g.fillStyle = '#9aa3a8'; g.fillRect(x + 312, 252, 46, 20);
    }
  }, rx, ry);

  const sideTex = (rx, ry) => canvasTex(256, 180, (g) => {
    g.fillStyle = '#f1ede4'; g.fillRect(0, 0, 256, 180);
    g.fillStyle = '#b9cbd6'; g.fillRect(40, 50, 40, 60); g.fillRect(176, 50, 40, 60);
    g.fillStyle = '#e0d9cc'; g.fillRect(0, 170, 256, 10);
  }, rx, ry);

  const roofBandTex = canvasTex(512, 64, (g) => {
    g.fillStyle = '#f4f0e8'; g.fillRect(0, 0, 512, 64);
    g.fillStyle = '#d96c4e'; g.fillRect(0, 22, 512, 10);
    g.fillStyle = '#5a9a86'; g.fillRect(0, 36, 512, 6);
  }, 4, 1);

  // ===================================================================
  // Apartment building (slab type, open exterior corridors on +z)
  // ===================================================================
  const LEN = 44, DEP = 10, TOP = FLOORS * FLOOR_H;
  const obstacles = [];
  function addObstacle(minX, maxX, minZ, maxZ) { obstacles.push({ minX, maxX, minZ, maxZ }); }

  function genericBuilding(cx, cz, ry, accent) {
    const g = new THREE.Group();
    const side = std(0xffffff, { map: sideTex(DEP / 5, FLOORS) });
    const mats = [side, side, M(0x9aa0a4), M(0x9aa0a4),
      std(0xffffff, { map: corridorFarTex(LEN / BAY, FLOORS) }),
      std(0xffffff, { map: balconyTex(LEN / BAY, FLOORS) })];
    box(LEN, TOP, DEP, mats, g, 0, TOP / 2, 0);
    const band = std(0xffffff, { map: roofBandTex });
    box(LEN + 0.4, 1.4, DEP + 0.4, band, g, 0, TOP + 0.7, 0);
    box(6, 3.2, 5, M(0xe9e4da), g, 0, TOP + 2.6, 0);
    box(6.2, 0.3, 5.2, M(accent || 0xd96c4e), g, 0, TOP + 4.3, 0);
    g.position.set(cx, 0, cz);
    g.rotation.y = ry || 0;
    scene.add(g);
    const hx = (Math.abs(Math.sin(ry || 0)) > 0.5 ? DEP : LEN) / 2 + 0.3;
    const hz = (Math.abs(Math.sin(ry || 0)) > 0.5 ? LEN : DEP) / 2 + 0.3;
    addObstacle(cx - hx, cx + hx, cz - hz, cz + hz);
    return g;
  }

  // --- Somi's building: walkable 15th-floor corridor; elevator core at the east end of the corridor ---
  const home = new THREE.Group();
  scene.add(home);
  const CX = 23.4, CZ = 5.95, CORE_X = 22.0; // car centre and the core's corridor-facing wall
  const F15 = 14 * FLOOR_H; // 39.2
  {
    const side = std(0xffffff, { map: sideTex(DEP / 5, FLOORS) });
    const roofM = M(0x9aa0a4);
    const balcM = std(0xffffff, { map: balconyTex(LEN / BAY, FLOORS) });
    box(LEN, TOP, 8, [side, side, roofM, roofM, M(0xd8d2c6), balcM], home, 0, TOP / 2, -1);

      if (u >= 1) {
        state = 'arriving'; doorTarget = 1; ui.floor.hidden = true;
        setMission('1층에 도착! 띵동'); coin('c1-05'); sfx('ding'); setTimeout(() => sfx('door'), 300);
        setTimeout(() => { state = 'autoExit'; setMission('공동현관 밖으로 나가요'); }, 1200);
      }
    }
    if (state === 'autoExit') {
      yaw += Math.atan2(Math.sin(-Math.PI / 2 - yaw), Math.cos(-Math.PI / 2 - yaw)) * Math.min(1, dt * 6);
      P.z += (CZ - P.z) * Math.min(1, dt * 4);
      P.x -= 2.6 * dt; moving = true;
      if (P.x < 19.2) state = 'exitLobby';
    }
    if (state === 'exitLobby') {
      state = 'walkToSchool';
      setMission('<b>상경초등학교</b>까지 가요. 길에서 친구를 만날지도?');
    }
    if (state === 'walkToSchool') {
      if (!haeunMet && P.distanceTo(haeun.root.position) < 2.4) setPrompt('<kbd>E</kbd> 하은이에게 말 걸기');
      else setPrompt('');
      if (P.z > ROAD_Z1 + 0.5) coin('c1-09');
      if (P.z > ROAD_Z1 + 0.5 && haeunFollow && warnT <= 0) setMission('잘 건넜어요! 이제 <b>학교 정문</b>으로 가요');
      if (P.z > SCHOOL_GATE_Z + 0.5 && Math.abs(P.x) < 4.5) {
        state = 'done'; setPrompt(''); setMission('상경초등학교 도착!'); coin('c1-10'); if (window.SomiSave) SomiSave.set(2); setTimeout(() => sfx('win'), 900);
        ui.done.hidden = false;
      }
    }
    if (state === 'arriving' || state === 'exitLobby' || state === 'autoExit') { if (car.position.y > 0) car.position.y = 0; }

    // apply to Somi
    somi.root.position.copy(P);
    somi.root.rotation.y = yaw;
    animateKid(somi, moving, dt, t, !grounded);
    updateGuide(t);
    animateKid(mom, false, dt, t, false);

    // Haeun waits, then walks beside Somi
    let hMoving = false;
    if (haeunFollow) {
      fwd.set(Math.sin(yaw), 0, Math.cos(yaw));
      tmp.set(P.x + Math.cos(yaw) * -1.1 - fwd.x * 0.6, 0, P.z - Math.sin(yaw) * -1.1 - fwd.z * 0.6);
      const dist = tmp.distanceTo(haeun.root.position);
      if (dist > 0.3) {
        hMoving = true;
        const step = Math.min(dist, dt * 3.6);
        tmp.sub(haeun.root.position).setY(0).normalize();
        haeun.root.position.addScaledVector(tmp, step);
        haeun.root.rotation.y = Math.atan2(tmp.x, tmp.z);
      }
    } else if (state === 'walkToSchool') {
      haeun.root.rotation.y = Math.atan2(P.x - haeun.root.position.x, P.z - haeun.root.position.z);
    }
    animateKid(haeun, hMoving, dt, t, false);
    haeun.arms[1].rotation.z = (!haeunFollow && state === 'walkToSchool' && !haeunMet) ? 2.5 + Math.sin(t * 8) * 0.25 : 0.12;

    // companion
    fwd.set(Math.sin(yaw), 0, Math.cos(yaw));
    tmp.set(P.x - fwd.x * 0.9 + Math.cos(yaw) * 0.7, P.y, P.z - fwd.z * 0.9 - Math.sin(yaw) * 0.7);
    if (state === 'inCar' || state === 'closing' || state === 'riding' || state === 'arriving') tmp.set(P.x + 0.5, P.y, P.z - 0.55);
    if (Math.abs(P.y - F15) < 1 && state !== 'riding') { tmp.z = THREE.MathUtils.clamp(tmp.z, 5.3, 6.5); if (!inCarNow()) tmp.x = Math.min(tmp.x, CORE_X - 0.3); }
    mon.position.x += (tmp.x - mon.position.x) * Math.min(1, dt * 4);
    mon.position.z += (tmp.z - mon.position.z) * Math.min(1, dt * 4);
    mon.position.y = tmp.y + (reduceMotion ? 0 : Math.abs(Math.sin(t * 5)) * 0.1);
    mon.rotation.y = Math.atan2(P.x - mon.position.x, P.z - mon.position.z);

    // road cars stop for the green walk signal and for Somi
    roadCars.forEach(c => {
      const x = c.obj.position.x, z = c.obj.position.z;
      const stopLine = c.dir > 0 ? -6.5 : 6.5;
      const ahead = (stopLine - x) * c.dir;
      let go = true;
      if (pedGreen && ahead > 0 && ahead < 9) go = false;
      const toSomi = (P.x - x) * c.dir;
      if (P.z > ROAD_Z0 - 0.3 && P.z < ROAD_Z1 + 0.3 && Math.abs(P.z - z) < 2.6 && toSomi > 0 && toSomi < 9) go = false;
      for (const o of roadCars) {
        if (o !== c && o.dir === c.dir) { const gap = (o.obj.position.x - x) * c.dir; if (gap > 0 && gap < 7) go = false; }
      }
      c.speed += ((go ? 9 : 0) - c.speed) * Math.min(1, dt * (go ? 1.2 : 4));
      c.obj.position.x += c.dir * c.speed * dt;
      if (c.obj.position.x > 110) c.obj.position.x = -110;
      if (c.obj.position.x < -110) c.obj.position.x = 110;
    });

    // camera: behind Somi, looking where she looks
    fwd.set(Math.sin(yaw), 0, Math.cos(yaw));
    const onCorridor = (Math.abs(P.y - F15) < 1.5 && state !== 'riding') || (P.y < 1.5 && P.z < 6.7 && P.x > -LEN / 2 && P.x < 25.2);
    const corY = P.y > 20 ? F15 : 0;
    const inCar = state === 'inCar' || state === 'closing' || state === 'riding' || state === 'arriving' || state === 'autoExit';
    if (inCar) {
      camPos.set(CX + 0.9, car.position.y + 2.3, CZ);
      camLook.set(CX - 3.4, car.position.y + 1.0, CZ);
    } else if (onCorridor) {
      camPos.set(P.x - fwd.x * 3.4, corY + 1.75, P.z - fwd.z * 3.4);
      camPos.x = THREE.MathUtils.clamp(camPos.x, -LEN / 2 + 0.4, CORE_X - 0.15);
      camPos.z = THREE.MathUtils.clamp(camPos.z + 0.35, 5.7, 6.55);
      const squeeze = 1 - Math.min(1, Math.hypot(camPos.x - P.x, camPos.z - P.z) / 3.2);
      camPos.y += squeeze * 0.85;
      camLook.set(P.x + fwd.x * 3, corY + 0.9 - squeeze * 0.6, P.z + fwd.z * 3);
    } else {
      let dist = 5.6;
      for (; dist > 1.4; dist -= 0.4) {
        camPos.set(P.x - fwd.x * dist, P.y + 2.4, P.z - fwd.z * dist);
        if (!camBlocked(camPos)) break;
      }
      
      camLook.set(P.x + fwd.x * 4, P.y + 0.75, P.z + fwd.z * 4);
    }
    if (!camReady) { camera.position.copy(camPos); camReady = true; }
    const k = inCar ? 1 : Math.min(1, dt * 5);
    camera.position.lerp(camPos, k);
    if (inCar) camera.position.copy(camPos);
    camera.lookAt(camLook);

    sun.position.set(P.x + 25, P.y + 45, P.z + 18);
    sun.target.position.set(P.x, P.y, P.z);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  window.__somiDebug = { scene: scene, camera: camera, P: P, car: car, haeun: haeun, get state() { return state; }, set state(v) { state = v; }, setYaw(v) { yaw = v; }, open(v) { doorTarget = v; doorsOpen = v; }, closeDlg() { while (dlg) { const st = dlg.steps[dlg.i]; if (st.choices) choose(0); advance(); } } };
  $('restart').addEventListener('click', reset);
  if (document.fonts) document.fonts.ready.then(() => {
    signs.forEach(s => { if (s.m.map) s.m.map.dispose(); s.m.map = label.apply(null, s.args); s.m.needsUpdate = true; });
  });
  if (window.SomiTitle) SomiTitle.onStart(reset); else reset();
  window.__somiState = () => state;
  requestAnimationFrame(frame);
})();
</script>
